name: Build avc_guard KPM

on:
  push:
    branches: [main, master]
    paths:
      - 'avc_guard.c'
      - 'Makefile'
      - 'avc_guard.lds'
      - '.github/workflows/build-kpm.yaml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  KP_REPO: https://github.com/ShirkNeko/SukiSU_KernelPatch_patch.git
  ARM_TOOLCHAIN_VER: 13.3.rel1
  ARM_TOOLCHAIN_NAME: arm-gnu-toolchain-13.3.rel1-x86_64-aarch64-none-elf

jobs:
  build-kpm:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Checkout source ──
      - name: Checkout KPM source
        uses: actions/checkout@v4

      # ── 2. Install bare-metal GCC cross-compiler ──
      - name: Install aarch64-none-elf toolchain
        run: |
          wget -q "https://developer.arm.com/-/media/Files/downloads/gnu/${ARM_TOOLCHAIN_VER}/binrel/${ARM_TOOLCHAIN_NAME}.tar.xz"
          tar -xf ${ARM_TOOLCHAIN_NAME}.tar.xz
          echo "$(pwd)/${ARM_TOOLCHAIN_NAME}/bin" >> $GITHUB_PATH
          export PATH="$(pwd)/${ARM_TOOLCHAIN_NAME}/bin:$PATH"
          aarch64-none-elf-gcc --version | head -1
          aarch64-none-elf-ld --version | head -1

      # ── 3. Clone KernelPatch headers ──
      - name: Clone SukiSU KernelPatch
        run: |
          git clone --depth=1 ${{ env.KP_REPO }} KernelPatch
          echo "KernelPatch HEAD: $(git -C KernelPatch rev-parse --short HEAD)"
          test -d KernelPatch/kernel/include || { echo "Missing kernel/include"; exit 1; }
          test -d KernelPatch/kernel/patch/include || { echo "Missing kernel/patch/include"; exit 1; }
          test -d KernelPatch/kernel/linux/include || { echo "Missing kernel/linux/include"; exit 1; }

      # ── 4. Build KPM ──
      - name: Build avc_guard.kpm
        run: |
          export TARGET_COMPILE=aarch64-none-elf-
          export PATH="$(pwd)/${ARM_TOOLCHAIN_NAME}/bin:$PATH"
          make clean
          make TARGET_COMPILE=$TARGET_COMPILE KP_DIR=./KernelPatch -j$(nproc)

      # ── 5. Validate: check ADRP relocations ──
      - name: Check ADRP relocations
        run: |
          export TARGET_COMPILE=aarch64-none-elf-
          export PATH="$(pwd)/${ARM_TOOLCHAIN_NAME}/bin:$PATH"
          echo "=== Section layout (should show only .text) ==="
          ${TARGET_COMPILE}readelf -S avc_guard.kpm | grep -E '\.[a-z]+' | grep -v '.symtab\|.strtab\|.shstrtab\|.rela' || true
          echo ""
          echo "=== Relocation summary ==="
          ${TARGET_COMPILE}readelf -r avc_guard.kpm | head -20
          echo ""
          echo "=== ADRP relocations (type 283 / ADR_PREL_PG_HI21) ==="
          count=$(${TARGET_COMPILE}readelf -r avc_guard.kpm | grep -cE 'ADR_PREL_PG_HI21|283' || true)
          if [ "$count" -eq 0 ]; then
            echo "OK: no ADRP relocations found"
          else
            echo "FAIL: $count ADRP relocations found"
            ${TARGET_COMPILE}readelf -r avc_guard.kpm | grep -E 'ADR_PREL_PG_HI21|283'
            exit 1
          fi

      # ── 6. Diagnosis: disassemble & locate ADRP sources ──
      - name: Diagnose ADRP sources via disassembly
        if: always()
        run: |
          export TARGET_COMPILE=aarch64-none-elf-
          export PATH="$(pwd)/${ARM_TOOLCHAIN_NAME}/bin:$PATH"
          echo "========================================"
          echo "  ADRP INSTRUCTION AUDIT (Scheme 3)   "
          echo "========================================"
          echo ""
          echo "--- 6a. ADRP instruction count in .o ---"
          adrp_count=$(${TARGET_COMPILE}objdump -d avc_guard.o | grep -c adrp || true)
          echo "ADRP instructions in avc_guard.o: $adrp_count"
          echo ""
          echo "--- 6b. ADRP instructions in final .kpm ---"
          adrp_kpm=$(${TARGET_COMPILE}objdump -d avc_guard.kpm | grep -c adrp || true)
          echo "ADRP instructions in avc_guard.kpm: $adrp_kpm"
          echo ""
          echo "--- 6c. Section headers (verify merge) ---"
          ${TARGET_COMPILE}readelf -S avc_guard.kpm
          echo ""
          echo "--- 6d. Symbol table (section check) ---"
          ${TARGET_COMPILE}nm avc_guard.kpm | head -n 60
          echo ""
          echo "--- 6e. ADRP sites with source lines ---"
          ${TARGET_COMPILE}objdump -S avc_guard.o > avc_guard.disasm.txt
          grep -n -B 3 -A 3 'adrp' avc_guard.disasm.txt | head -n 200 || echo "No ADRP found"
          echo ""
          echo "--- 6f. Relocation types breakdown ---"
          ${TARGET_COMPILE}readelf -r avc_guard.kpm | awk 'NF>=3 {print $3}' | sort | uniq -c | sort -rn | head -n 20
          echo ""
          echo "========================================"
          echo "  ADRP audit complete                  "
          echo "========================================"

      # ── 7. Upload diagnosis artifacts ──
      - name: Upload diagnosis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avc_guard-diagnosis-${{ github.run_number }}-${{ github.sha }}
          path: |
            avc_guard.kpm
            avc_guard.o
            avc_guard.disasm.txt
            avc_guard.lds
          retention-days: 30

      # ── 8. Release on tag ──
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: avc_guard.kpm
          body: |
            **avc_guard KPM**
            - Target: Linux 4.14+ arm64 (SukiSU / KernelPatch)
            - KernelPatch: [SukiSU-Ultra/SukiSU_KernelPatch_patch](${{ env.KP_REPO }})
            - Compiler: GCC aarch64-none-elf
            - Build: ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
