name: Build avc_guard KPM

on:
  push:
    branches: [main, master]
    paths:
      - 'avc_guard.c'
      - 'Makefile'
      - '.github/workflows/build-kpm.yaml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  KP_REPO: https://github.com/ShirkNeko/SukiSU_KernelPatch_patch.git

jobs:
  build-kpm:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Checkout source ──
      - name: Checkout KPM source
        uses: actions/checkout@v4

      # ── 2. Install GCC cross-compiler ──
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version | head -1
          aarch64-linux-gnu-ld --version | head -1

      # ── 3. Clone KernelPatch headers ──
      - name: Clone SukiSU KernelPatch
        run: |
          git clone --depth=1 ${{ env.KP_REPO }} KernelPatch
          echo "KernelPatch HEAD: $(git -C KernelPatch rev-parse --short HEAD)"
          test -d KernelPatch/kernel/include || { echo "Missing kernel/include"; exit 1; }
          test -d KernelPatch/kernel/patch/include || { echo "Missing kernel/patch/include"; exit 1; }
          test -d KernelPatch/kernel/linux/include || { echo "Missing kernel/linux/include"; exit 1; }

      # ── 4. Build KPM ──
      - name: Build avc_guard.kpm
        run: |
          make clean
          make KP_DIR=./KernelPatch NDK_HOME=/home/runner/work/AVC-furioso/AVC-furioso/android-ndk-r25c -j$(nproc)

      # ── 5. Validate KPM structure ──
      - name: Validate KPM sections
        run: |
          echo "=== Section headers ==="
          aarch64-linux-gnu-readelf -S avc_guard.kpm | grep -E '\.kpm|\.symtab|\.strtab'
          echo "=== Relocations (must NOT contain type 283) ==="
          aarch64-linux-gnu-readelf -r avc_guard.kpm | grep -c '283' && echo "FAIL: type 283 found" || echo "OK: no type 283"
          echo "=== File info ==="
          file avc_guard.kpm
          aarch64-linux-gnu-readelf -r avc_guard.kpm | grep '283'

      # ── 6. Upload artifact ──
      - name: Upload KPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: avc_guard-${{ github.run_number }}-${{ github.sha }}
          path: avc_guard.kpm
          retention-days: 30

      # ── 7. Release on tag ──
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: avc_guard.kpm
          body: |
            **avc_guard KPM**
            - Target: Linux 4.14+ arm64 (MT6893 / generic)
            - KernelPatch: [SukiSU-Ultra/SukiSU_KernelPatch_patch](${{ env.KP_REPO }})
            - Compiler: GCC aarch64-linux-gnu
            - Build: ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
