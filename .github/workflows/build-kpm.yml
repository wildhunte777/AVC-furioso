name: Build avc_guard KPM

on:
  push:
    branches: [main, master]
    paths:
      - 'avc_guard.c'
      - 'Makefile'
      - '.github/workflows/build-kpm.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Kernel branch (for version info)'
        default: 'chopin_kvm'
        required: false

env:
  NDK_VERSION: r25c
  NDK_URL: https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
  KP_REPO: https://github.com/ShirkNeko/SukiSU_KernelPatch_patch.git
  KERNEL_REPO: https://github.com/wildhunte777/kernel_mt6893.git

jobs:
  build-kpm:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Checkout this repo (KPM source only) ──
      - name: Checkout KPM source
        uses: actions/checkout@v4

      # ── 2. Clone KernelPatch (build headers) ──
      - name: Clone KernelPatch
        run: |
          git clone --depth=1 ${{ env.KP_REPO }} KernelPatch
          echo "KernelPatch HEAD:"
          git -C KernelPatch log --oneline -1

      # ── 3. Clone kernel repo (optional, for version metadata) ──
      - name: Clone kernel for version info
        run: |
          git clone --depth=1 -b ${{ github.event.inputs.kernel_branch || 'chopin_kvm' }} \
            ${{ env.KERNEL_REPO }} kernel_mt6893
          echo "Kernel version:"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' kernel_mt6893/Makefile | head -3

      # ── 4. Download & extract Android NDK ──
      - name: Setup Android NDK
        run: |
          wget -q ${{ env.NDK_URL }} -O ndk.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-${{ env.NDK_VERSION }}" >> $GITHUB_ENV
          echo "NDK ready: $PWD/android-ndk-${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang --version"
          $PWD/android-ndk-${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang --version | head -1

      # ── 5. Build KPM ──
      - name: Build avc_guard.kpm
        run: |
          make KP_DIR=./KernelPatch NDK_PATH=${{ env.ANDROID_NDK_HOME }} -j$(nproc)
          ls -la avc_guard.kpm
          file avc_guard.kpm

      # ── 6. Upload artifact ──
      - name: Upload KPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: avc_guard-${{ github.run_number }}
          path: avc_guard.kpm
          retention-days: 30

      # ── 7. Create Release (only on push to main with tag) ──
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: avc_guard.kpm
          body: |
            avc_guard KPM module
            - Target: Linux 4.14 arm64 (MT6893)
            - Kernel: wildhunte777/kernel_mt6893 @ ${{ github.event.inputs.kernel_branch || 'chopin_kvm' }}
            - KernelPatch: ShirkNeko/SukiSU_KernelPatch_patch
            - NDK: ${{ env.NDK_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
